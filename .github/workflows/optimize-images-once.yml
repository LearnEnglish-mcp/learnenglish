name: Optimize images once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-images-once.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install image optimizers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y optipng gifsicle webp imagemagick

      - name: Compress images except protected logos
        shell: bash
        run: |
          set -uo pipefail

          changed=0
          skipped_logo=0
          kept=0
          failed=0
          before_total=0
          after_total=0

          while IFS= read -r -d '' f; do
            base="$(basename "$f")"
            low="${base,,}"

            # Protect both spellings seen/referenced in this repository/conversation.
            if [[ "$low" == logomcb* || "$low" == logomcp* ]]; then
              skipped_logo=$((skipped_logo + 1))
              continue
            fi

            before=$(stat -c%s "$f" 2>/dev/null || echo 0)
            before_total=$((before_total + before))
            backup="$(mktemp)"
            cp -p "$f" "$backup"
            ext="${low##*.}"
            ok=1

            case "$ext" in
              jpg|jpeg)
                tmp="$(mktemp --suffix=.jpg)"
                if convert "$f" -auto-orient -strip -interlace Plane -sampling-factor 4:2:0 -quality 85 "$tmp" >/dev/null 2>&1; then
                  cp -p "$tmp" "$f"
                else
                  ok=0
                fi
                rm -f "$tmp"
                ;;
              png)
                optipng -o5 -quiet "$f" >/dev/null 2>&1 || ok=0
                ;;
              gif)
                tmp="$(mktemp --suffix=.gif)"
                if gifsicle -O3 "$f" -o "$tmp" >/dev/null 2>&1; then
                  cp -p "$tmp" "$f"
                else
                  ok=0
                fi
                rm -f "$tmp"
                ;;
              webp)
                if webpmux -info "$f" 2>/dev/null | grep -qi 'animation'; then
                  ok=0
                else
                  tmp="$(mktemp --suffix=.webp)"
                  if cwebp -quiet -q 85 -m 6 "$f" -o "$tmp" >/dev/null 2>&1; then
                    cp -p "$tmp" "$f"
                  else
                    ok=0
                  fi
                  rm -f "$tmp"
                fi
                ;;
              tif|tiff)
                tmp="$(mktemp --suffix=.tiff)"
                if convert "$f" -strip -compress Zip "$tmp" >/dev/null 2>&1; then
                  cp -p "$tmp" "$f"
                else
                  ok=0
                fi
                rm -f "$tmp"
                ;;
              bmp)
                tmp="$(mktemp --suffix=.bmp)"
                if convert "$f" "$tmp" >/dev/null 2>&1; then
                  cp -p "$tmp" "$f"
                else
                  ok=0
                fi
                rm -f "$tmp"
                ;;
              avif)
                tmp="$(mktemp --suffix=.avif)"
                if convert "$f" -strip -quality 82 "$tmp" >/dev/null 2>&1; then
                  cp -p "$tmp" "$f"
                else
                  ok=0
                fi
                rm -f "$tmp"
                ;;
              *)
                ok=0
                ;;
            esac

            after=$(stat -c%s "$f" 2>/dev/null || echo "$before")
            if [[ "$ok" -eq 1 && "$after" -lt "$before" ]]; then
              changed=$((changed + 1))
              after_total=$((after_total + after))
              rm -f "$backup"
              printf 'COMPRESSED %s: %s -> %s bytes\n' "$f" "$before" "$after"
            else
              cp -p "$backup" "$f"
              rm -f "$backup"
              after_total=$((after_total + before))
              if [[ "$ok" -eq 1 ]]; then
                kept=$((kept + 1))
              else
                failed=$((failed + 1))
              fi
            fi
          done < <(find . -type f -not -path './.git/*' \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.gif' -o -iname '*.webp' -o -iname '*.tif' -o -iname '*.tiff' -o -iname '*.bmp' -o -iname '*.avif' \) -print0)

          saved=$((before_total - after_total))
          if [[ "$before_total" -gt 0 ]]; then
            pct=$(awk -v s="$saved" -v b="$before_total" 'BEGIN { printf "%.1f", (s*100)/b }')
          else
            pct="0.0"
          fi

          echo "changed=$changed" >> "$GITHUB_ENV"
          echo "skipped_logo=$skipped_logo" >> "$GITHUB_ENV"
          echo "kept=$kept" >> "$GITHUB_ENV"
          echo "failed=$failed" >> "$GITHUB_ENV"
          echo "before_total=$before_total" >> "$GITHUB_ENV"
          echo "after_total=$after_total" >> "$GITHUB_ENV"
          echo "saved=$saved" >> "$GITHUB_ENV"
          echo "pct=$pct" >> "$GITHUB_ENV"

          {
            echo '### Image optimization result'
            echo "- Images compressed: $changed"
            echo "- Protected logo images skipped: $skipped_logo"
            echo "- Images already optimal/not smaller: $kept"
            echo "- Unsupported/unsafe-to-reencode images kept: $failed"
            echo "- Before: $before_total bytes"
            echo "- After: $after_total bytes"
            echo "- Saved: $saved bytes ($pct%)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit optimized images
        if: env.changed != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u -- .
          git commit -m "Optimize images except protected logos (${saved} bytes saved, ${pct}%)"
          git push origin HEAD:main
