<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <title>Đăng nhập quản trị - MCP Siblings</title>

    <style>
        :root {
            --green: #079a76;
            --green-dark: #05785d;
            --green-light: #eafaf4;
            --border: #d7e9e2;
            --text: #172036;
            --muted: #68748a;
            --danger: #c83245;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 15% 10%, #dff8ef 0, transparent 32%),
                radial-gradient(circle at 85% 90%, #dff1ff 0, transparent 30%),
                #f5fcfa;
        }

        button, input { font: inherit; }

        .login-card {
            width: min(470px, 100%);
            padding: 30px;
            border: 1px solid var(--border);
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 22px 55px rgba(28, 75, 61, 0.14);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .brand img {
            width: 67px;
            height: 67px;
            object-fit: contain;
            border-radius: 15px;
            background: #fff;
        }

        .brand h1 {
            margin: 0;
            font-size: 25px;
        }

        .brand p {
            margin: 5px 0 0;
            color: var(--green);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .badge {
            display: inline-block;
            margin-bottom: 12px;
            padding: 7px 11px;
            border-radius: 999px;
            color: var(--green-dark);
            background: var(--green-light);
            font-size: 12px;
            font-weight: 800;
        }

        h2 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .description {
            margin: 0 0 23px;
            color: var(--muted);
            line-height: 1.55;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 750;
        }

        .password-row {
            display: flex;
            overflow: hidden;
            border: 1px solid #cbd9df;
            border-radius: 12px;
            background: #fff;
        }

        .password-row:focus-within {
            border-color: var(--green);
            box-shadow: 0 0 0 4px rgba(7, 154, 118, 0.11);
        }

        .password-row input {
            flex: 1;
            min-width: 0;
            padding: 13px 14px;
            border: 0;
            outline: 0;
        }

        .password-row button {
            width: 58px;
            border: 0;
            cursor: pointer;
            color: #425066;
            background: #f2f7f5;
        }

        .login-button {
            width: 100%;
            margin-top: 16px;
            padding: 13px 16px;
            border: 0;
            border-radius: 12px;
            cursor: pointer;
            color: #fff;
            background: var(--green);
            font-weight: 800;
        }

        .login-button:hover { background: var(--green-dark); }
        .login-button:disabled { cursor: not-allowed; opacity: 0.55; }

        .message {
            min-height: 24px;
            margin-top: 13px;
            color: var(--danger);
            font-size: 14px;
            line-height: 1.5;
        }

        .home-link {
            margin-top: 18px;
            display: block;
            color: var(--green-dark);
            text-align: center;
            text-decoration: none;
            font-weight: 700;
        }
    </style>

    <script src="admin-config.js"></script>
</head>

<body>
    <main class="login-card">
        <div class="brand">
            <img src="common/LogoMCP.png" alt="Logo MCP Siblings">
            <div>
                <h1>MCP Siblings</h1>
                <p>Administrator</p>
            </div>
        </div>

        <span class="badge">🔐 KHU VỰC RIÊNG</span>
        <h2>Đăng nhập quản trị</h2>

        <p class="description">
            Nhập mật khẩu riêng của bạn để mở trang quản trị.
        </p>

        <form id="loginForm">
            <label for="password">Mật khẩu</label>

            <div class="password-row">
                <input
                    id="password"
                    type="password"
                    autocomplete="current-password"
                    placeholder="Nhập mật khẩu quản trị"
                    required
                    autofocus
                >

                <button
                    id="togglePassword"
                    type="button"
                    aria-label="Hiện hoặc ẩn mật khẩu"
                    title="Hiện hoặc ẩn mật khẩu"
                >
                    👁️
                </button>
            </div>

            <button class="login-button" id="loginButton" type="submit">
                Đăng nhập
            </button>

            <div class="message" id="message" role="alert"></div>
        </form>

        <a class="home-link" href="index.html">← Trở về trang học</a>
    </main>

    <script>
        "use strict";

        const config = window.MCP_ADMIN_CONFIG || {};
        const PASSWORD_SALT = config.salt || "";
        const PASSWORD_HASH = config.passwordHash || "";

        const SESSION_MINUTES = 30;
        const MAX_ATTEMPTS = 5;
        const LOCK_SECONDS = 30;

        const form = document.getElementById("loginForm");
        const passwordInput = document.getElementById("password");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");
        const togglePassword = document.getElementById("togglePassword");

        let failedAttempts = 0;
        let lockTimer = null;

        function bytesToHex(buffer) {
            return Array.from(new Uint8Array(buffer))
                .map((byte) => byte.toString(16).padStart(2, "0"))
                .join("");
        }

        async function sha256(text) {
            if (!window.crypto || !window.crypto.subtle) {
                throw new Error(
                    "Trình duyệt không hỗ trợ kiểm tra mật khẩu."
                );
            }

            const data = new TextEncoder().encode(text);
            const digest = await crypto.subtle.digest("SHA-256", data);

            return bytesToHex(digest);
        }

        function createSession() {
            const expiresAt =
                Date.now() + SESSION_MINUTES * 60 * 1000;

            sessionStorage.setItem("mcpAdminAuthenticated", "1");
            sessionStorage.setItem(
                "mcpAdminExpiresAt",
                String(expiresAt)
            );
        }

        function startLock() {
            let remaining = LOCK_SECONDS;

            loginButton.disabled = true;
            passwordInput.disabled = true;

            message.textContent =
                `Nhập sai quá nhiều lần. Thử lại sau ${remaining} giây.`;

            lockTimer = setInterval(() => {
                remaining -= 1;

                if (remaining <= 0) {
                    clearInterval(lockTimer);
                    lockTimer = null;
                    failedAttempts = 0;
                    loginButton.disabled = false;
                    passwordInput.disabled = false;
                    message.textContent = "";
                    passwordInput.focus();
                    return;
                }

                message.textContent =
                    `Nhập sai quá nhiều lần. Thử lại sau ${remaining} giây.`;
            }, 1000);
        }

        togglePassword.addEventListener("click", () => {
            const showing = passwordInput.type === "text";

            passwordInput.type = showing ? "password" : "text";
            togglePassword.textContent = showing ? "👁️" : "🙈";
            passwordInput.focus();
        });

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            if (lockTimer) {
                return;
            }

            if (!PASSWORD_SALT || !PASSWORD_HASH) {
                message.textContent =
                    "Thiếu hoặc lỗi file admin-config.js.";
                return;
            }

            message.textContent = "Đang kiểm tra...";
            loginButton.disabled = true;

            try {
                const enteredHash = await sha256(
                    PASSWORD_SALT + passwordInput.value
                );

                if (enteredHash === PASSWORD_HASH) {
                    createSession();
                    location.replace("admin.html");
                    return;
                }

                failedAttempts += 1;
                passwordInput.value = "";

                if (failedAttempts >= MAX_ATTEMPTS) {
                    startLock();
                    return;
                }

                message.textContent =
                    `Mật khẩu không đúng. Còn ` +
                    `${MAX_ATTEMPTS - failedAttempts} lần thử.`;

                loginButton.disabled = false;
                passwordInput.focus();
            } catch (error) {
                message.textContent =
                    error.message || "Không thể kiểm tra mật khẩu.";
                loginButton.disabled = false;
            }
        });

        const existingExpiry = Number(
            sessionStorage.getItem("mcpAdminExpiresAt")
        );

        if (
            sessionStorage.getItem("mcpAdminAuthenticated") === "1" &&
            existingExpiry > Date.now()
        ) {
            location.replace("admin.html");
        }
    </script>
</body>
</html>
